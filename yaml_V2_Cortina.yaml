            - Reference to generate Nayax Number, Used as External Transaction Identification for external parties (Usually Card schemes, or App service providers).From support perspective - It is highly recommanded that this ID shall be the one visble to the end consumer/Card holder and the card's Issuer (e.g. Bank) or Application service provider (e.g. ALipay, WeChat). If none of the above is applicable, the Integrator shall generate an additional String.
            - This Value shall be echoed in the \/Inquiry request.
          example: '111111'
