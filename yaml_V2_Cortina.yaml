openapi: 3.0.1
servers:
  - url: https://{domain}:{port}/api
    variables:
      domain:
        default: example.com
        description: Customer ID assigned by the service provider
      port:
        enum:
          - '443'
          - '8443'
        default: '443'
info:
  title: Nayax Cortina API
  description: Credit Card, Prepaid, DynamicQR, StaticQR APIs
  version: v2
  x-logo:
    url: 'https://www.nayax.com//wp-content/uploads/2015/10/logo_dark1.png'            
tags:
  - name: Cortina
    description: |
     ![Business Case](Redoc/ExternalPPv2/1Illustration.PNG)
     # Overview
     > Welcome to Cortina API Payment Solution,
     > The Cortina is collection of API methods allow a payment gateway (an Integrator) to process payment via  Nayax systems.
     > Cortina supports the following payment methods -
     > * Credit Cards
     > * Prepaid Cards
     > * Static QR
     > * Dynamic QR
     > We are offering 2 payment flows to address your needs -
     > * Preauthorization - A 2 steps payment approach in which Nayax first authorize hold on default amount in the consumer balance (prior to consumer choosing a product (/service)), following by a finalizing settlement on the actual amount according to the Product (/service) the consumer has received. 
     > ![External Prepaid Flow](Redoc/CortinaMain/Preauthorization.PNG)
     > * Preselection - A 1 step sale approach in which the desired product (or a service) by the consumer is already known, and the payment will be on that actual amount. 
     > ![External Prepaid Flow](Redoc/CortinaMain/Preselection.PNG)
     > * To download Cortina v2 skeleton code [Press here](./Redoc/Skeleton/Cortina%20V2%20Skeleton.zip).

  - name: DynamicQR
    description: |
     ![Business Case](Redoc/DynamicQR/BusinesCasePOCex.PNG)
     # Dynamic QR Overview
     > This section describes the Nayax Gateway Dynamic QR transaction flow, including API calls and parameters.
     > The Nayax Cortina Dynamic QR API can be used to process  payments  on the following Nayax devices- VPOS Touch and Onyx.
     > ![DynamicQR Flow](Redoc/DynamicQR/QrDynamicIlusatrationFlow.PNG)
     # Cortina Dynamic QR Flow  
     > 'Dynamic QR' is a flow where each transaction has its own unique QR code that is generated and displayed for the application user  to scan, in order to process  the payment.  
     > Cortina Dynamic QR currently supports a ‘Pre-selection’ flow.
     > Pre-selection is a one-step transaction flow where Nayax requests to charge the Application User  a pre- amount in a single request.
     > ![Transaction Flow](Redoc/DynamicQR/TransactionFlowTypicalPositive.PNG)
     # Typical fail scenarios - 
     ## Transaction Flow Typical Payment Declined      
     ![Transaction Flow](Redoc/DynamicQR/TransactionFlowTypicalPaymentDeclined.PNG)
     ## Transaction Flow Typical Vend Fail      
     ![Transaction Flow](Redoc/DynamicQR/TransactionFlowTypicalVendFail.PNG)
     ## Transaction Flow Typical Time Out      
     ![Transaction Flow](Redoc/DynamicQR/TransactionFlowTypicalTimeOut.PNG)
     ## Manual Refund / Auto Void      
     ![Manual Refund](Redoc/DynamicQR/ManuelRefund_AutoVoid.PNG) 
     # Technical Prerequisites
     * Cortina is a REST interface over HTTPS (TLS > V1.2) using JSON format for I/O.
     * NOTE, Site to Site VPN is optional. If needed discuss with your technical point of contact at Nayax.
     ### **Provided by Nayax to the Integrator**
      * Integrators are given a unique token (Secret Token Value and Secret Token ID) for two-sided communication. 
      * NOTE, From time-to-time Nayax may contact the integrator to replace the token.
      * Nayax will provide the integrator with a test POS device    
     ### **Provided by Integrator to Nayax**
      * In order to utilize the Corina API, integrators need to provide Nayax with the following.
      * HTTPS URL access points -  
        * Https TEST environment URL.
        * Https Production environment URL. 
      * In case of multiple payment channels (under the same dynamic QR), the integrator will provide the following attributes -  
      * Channel ID (string NameOfChannel) that will be in the route of the API call- / GenerateQR/ NameOfChannel.
      * Channels' logos (JPEG ChannelImage), that will be shown on the Nayax device screen. 
      * Desired timeout in milliseconds, range between [Int] 1000 – 15000..
      * Desired polling settings configurations- 
      * QR Polling Timeout Milliseconds, range between [Int] 60000 – 180000.
      * QR Polling Attempts, range between [Int] 1 – 100 .
      * QR Interval Polling delay, range between [Int] 1000 – 15000.  
      * Custom API fields needed to integrate.
      * Relevant testing means. (e.g., demi test accounts , demi cards, etc.).
      
  - name: StaticQR
    description: |
     ![Business Case](Redoc/StaticQR/Illustration.PNG)
     # Static QR Overview
     > This section describes the Nayax Gateway Static QR transaction flow, API calls and parameters.
     > Integrators can use the Nayax Cortina Static QR API to process payment via Static QR payment on the following Nayax devices- VPOS Touch and Onyx.
     > ![StaticQR Flow](Redoc/StaticQR/UseCase.PNG)
     # Cortina Static QR Flow
     > Cortina 'Static QR'  is a flow in which a fixed (Static) QR code is scanned  to perform a transaction.
     > Cortina Static QR supports 2 types of transactions - 
     > * 'Pre-authorization' transaction, with a 2-step flow 
     >   * Authorization - Nayax requests to temporarily hold credit in the consumer account balance.
     >   * Settlement – Nayax requests to complete the transaction and to charge a partial / full amount from the original authorization request.
     > * 'Pre-selection' transaction with a single step flow
     >   * Sale - Nayax requests to charge the consumer for a specific known amount in a single request.
     # Typical Success scenarios
     ## PreAuthorization  
     > ![Transaction Flow](Redoc/StaticQR/1PA_TypicalPositivePreauthorizationScenario.PNG)
     ## PreSelecation
     ### Chossing a product on the vending machine
     > ![Transaction Flow](Redoc/StaticQR/2PS_TypicalPositivePreaSelectionScenario.PNG)
     ### Chossing a product Via App (Remote Vend)
     > ![Transaction Flow](Redoc/StaticQR/3PS_TypicalPositivePreaSelectionRemoteGame.PNG)
