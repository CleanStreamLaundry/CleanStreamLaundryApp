     ### Typical Vend Failed Scenario - Confused Consumer      
     ![Manual Refund](Redoc/StaticQR/7PA_TypicalVendFailedConfusedConsumer.PNG)
     ### Typical Consumer Inactivity Scenario      
     ![Manual Refund](Redoc/StaticQR/8PA_TypicalConsumerInactivity.PNG)  
     ## PreSelecation  
     ### Typical Payment Decline Scenario - Sale Failed   
     ![Transaction Flow](Redoc/StaticQR/15SaleFailedScenario.PNG))
     ### Typical Vend Failed Scenario - Machine Dispense Failure      
     ![Transaction Flow](Redoc/StaticQR/10PS_TypicalVendFailedMachineDispenseFailure.PNG)
     ### Typical Vend Failed Scenario - Confused Consumer      
     ![Transaction Flow](Redoc/StaticQR/11PS_TypicalVendFailedConfusedConsumer.PNG)
     ### Typical Vend Failed Scenario - Confused Consumer (option 2)      
     ![Manual Refund](Redoc/StaticQR/12PS_TypicalVendFailedConfusedConsumer2.PNG)
     ### Typical Device Failed Scenario - No Settelment      
     ![Manual Refund](Redoc/StaticQR/13PS_TypicalDeviceFailedSettelmend.PNG)
     ### Typical Consumer Inactivity Scenario       
     ![Manual Refund](Redoc/StaticQR/14PS_TypicalConsumerInactivity.PNG)
     # Technical Prerequisites
     * Cortina is a REST interface over HTTPS (TLS > V1.2) using JSON format for I/O. 
     * NOTE, Site-to-Site VPN is optional. If needed discuss with your technical point of contact at Nayax.
     ### **Provided by Nayax to the Integrator**
     [WhiteListingRefferal]: Redoc/CortinaMain/NayaxIpWhitelisting.pdf
      * Unique token (Secret Token Value and Secret Token ID) for two-sided communication. 
      * From time-to-time Nayax may contact the integrator to replace the token.
      * To download IP whitelisting (if needed) [Press here](./Redoc/CortinaMain/NayaxIpWhitelisting.pdf)  
      * Nayax Cortina EndPoints - 
        * HTTPS TEST environment URL - `https://qa2-lynx.nayax.com/Payment/#Version/Cortina/[#PaymentProviderName]/start`
        * HTTPS Prod environment URL - `https://lynx.nayax.com/Payment/#Version/Cortina/[#PaymentProviderName]/start`
     * Optional - Nayax relevant POS devices.
     ### **Provided by Integrator to Nayax**
      * HTTPS URL access end points -  
        * HTTPS TEST environment URL.
        * HTTPS Production environment URL. 
      * Desired timeout in milliseconds - range between [Int] 1000 – 15000, default value is 1500. 
      * Custom fields according to Nayax Hierarchy as needed.
      * Distributor > Operator > Direct Actor > Machine / Device. 
      * Relevant testing means. (e.g., demi test accounts , demi cards, etc.). 
 
  - name: Cortina Prepaid
    description: |
     ![Business Case](Redoc/ExternalPPv2/1Illustration.PNG)
     # External Prepaid Overview
     > This section describes Nayax Gateway External Prepaid V2 transaction flow,  API calls and parameters.
     > Integrators (Payment Gateways) can use the Nayax Cortina External Prepaid V2 API to confirm External Prepaid V2 payment on Nayax devices such as VPOS Touch and Onyx.
     > ![External Prepaid Flow](Redoc/ExternalPPv2/3BusinessCase.PNG)
     > * To download the full Docomentation [Press here](./Redoc/ExternalPPv2/Cortina%20V2%20External%20Prepaid%20API.pdf).
     # Cortina External Prepaid V2 Flow
     > 'Cortina External Prepaid V2' is a flow in which an external prepaid card are use directly on the Nayax point of sale device in order to perform a transaction.
     > Cortina External Prepaid V2 supports 2 types of transactions - 
     > * 'Preauthorization' Flow  
     >   * Authorization - Nayax requests to temporarily hold credit in the consumer’s account balance.
     >   * Settlement – Nayax requests to complete the transaction and to charge a partial / full amount from the original authorization request.
     > * 'Pre-selection' Flow  
     >   * Sale - Nayax requests to charge the consumer for a specific known amount in a single request.
     # Typical Success scenarios
     ## PreAuthorization  
     > ![Transaction Flow 1](Redoc/ExternalPPv2/4TypicalPositivePreauthorizationScenario.png)
     > * For activity number 4.b - Start Session Failed Scenario, please check the [following process](#typical-establish-security-failed-scenario---start-session-failed).
     > * For activity number 8.b – User failed to choose a valid product in time Scenario, please check the [following process](#typical-confused-consumer-scenario---inactivity--cancel-invalid-choice).
     > * For activity number 10.b – Vend Failed Scenario, please check the [following process](#typical-vend-failure-scenario---machine-dispence-failure).
     > * For activity number 12.b – Settlement response Failed Scenario, please check the [following process](#typical-payment-decline-scenario---settlement-failed).
     ## PreSelecation
     > ![Transaction Flow 2](Redoc/ExternalPPv2/11TypicalPositivePreselectionScenario.png)
     > * For activity number 3.b – User failed to choose a valid product in time Scenario, please check the [following process](#typical-confused-consumer-scenario---inactivitycancelinvalid-choose).
     > * For activity number 5.b - Start Session Failed Scenario, please check the [following process](#typical-establish-security-failed-scenario---start-session-failed).
     > * For activity number 6.b – Sale request Failed Scenario, please check the [following process](#typical-payment-decline-scenario---sale-failed). 
     > * For activity number 9.b – Vend Failed Scenario, please check the [following process](#typical-vend-failure-scenario---machine-dispence-failure).
     > * For activity number 11.b – Sale End Notification Response Failed Scenario, please check the [following process](#typical-notification-failed-scenario---sale-end-notification-failed).
     # Typical fail scenarios
     ## PreAuthorization  
     ### Typical establish security failed Scenario - Start Session Failed   
     ![Transaction Flow 3](Redoc/ExternalPPv2/5StartSessionFailed.PNG)
     ### Typical Payment Decline Scenario - Authorization Failed      
     ![Transaction Flow 4](Redoc/ExternalPPv2/6AuthorizationFailedScenario.PNG)
     ### Typical Confused Consumer Scenario - Inactivity / Cancel /Invalid Choice      
     ![Transaction Flow 5](Redoc/ExternalPPv2/6PreauthorisationConfusedConsumer.PNG)
     ### Typical Vend Failure Scenario - Machine Dispence Failure      
     ![Manual Refund 6](Redoc/ExternalPPv2/7PreauthorizationVendFail.PNG)
     ### Typical Payment Decline Scenario - Settlement Failed      
     ![Manual Refund 7](Redoc/ExternalPPv2/8PreauthorizationSettlementFailed.PNG)  
     ## PreSelecation  
     ### Typical Confused Consumer Scenario - Inactivity/Cancel/invalid choose      
     ![Transaction Flow 8](Redoc/ExternalPPv2/12PreSelectionConfusedConsumer.PNG)
     ### Typical establish security failed Scenario - Start Session Failed     
     ![Transaction Flow 9](Redoc/ExternalPPv2/13StartSessionFailed.PNG)
     ### Typical Payment Decline Scenario - Sale Failed        
     ![Transaction Flow 10](Redoc/ExternalPPv2/14SaleFailedScenario.PNG)
     ### Typical Vend Failure Scenario - Machine Dispence Failure       
     ![Transaction Flow 11](Redoc/ExternalPPv2/15PreSelectionVendFail.PNG)
     ### Typical Notification failed Scenario - Sale End notification failed      
     ![Transaction Flow 12](Redoc/ExternalPPv2/16SaleEndNotificationFailed.PNG)
     ### Typical Payment Decline Scenario - Void Failed      
     ![Transaction Flow 13](Redoc/ExternalPPv2/17PreselectionVoidFailed.PNG)
     # Technical Prerequisites
     * Cortina is a REST interface over HTTPS (TLS > V1.2) using JSON format for I/O. 
     * NOTE, Site to Site VPN is optional. If needed discuss with your technical point of contact at Nayax.
     ### **Provided by Nayax to the Integrator**
      * Secret Token (Token_Value, Token_ID) - Nayax provides an Integrator with a unique secret token (Secret Token Value and Secret Token ID) for communication. 
      * NOTE, From time to time Nayax may contact the integrator to replace the Token.
      * To download IP whitelisting (if needed) [Press here](./Redoc/CortinaMain/NayaxIpWhitelisting.pdf)        
      * Optional - Nayax relevant POS devices. 
     ### **Provided by Integrator to Nayax**
      * HTTPS URL access endpoints -  
        * HTTPS URL - TEST environment
        * HTTPS URL - Production environment 
      * the Desired timeout in milliseconds ranges between [Int] 1000 – 15000, the default value is 15000 -  
      * Immediate void settings- In case of T/O in authorization or settlement request, the Nayax server will perform  2  attempts to cancel/void the transaction with 30 seconds intervals between them, by default. For more details contact Nayax's technical point of contact. 
      * In preselection transactions by default Nayax will perform Sale end notification to inform the integrator (payment gateway) that the operator has completed the transaction successfully. For more details contact Nayax's technical point of contact.
      * Custom fields as needed, according to Nayax hierarchy - Distributor > Operator > Direct Actor > Machine / Device. 
      * Relevant testing means. (e.g., card data (in stripe cards ), or physical test cards in other cases).
      * In case of a URL endpoint per different merchants, please provide a CSV file that contains a list of URLs per merchant ID, with, as a delimiter. For details please contact your Nayax technical point of contact regarding Dynamic URL.
      * Prepaid Card Format  - please provide Nayax with the exact Format of your card.  
 
  - name: Cortina Credit Card
    description: |
     ![Business Case](Redoc/CreditCardV2/1Illustration.PNG)
     # Credit Card Overview
     > This Section describes Credit Card transaction flow on Nayax Cortina V2, as well as API calls and parameters.
     > Integrators (Payment Gateways) may use the Nayax Cortina Credit Card API to assure Credit Card payment via relevant Nayax devices such as VPOS Touch and Onyx.
     > ![Credit Card Flow](Redoc/CreditCardV2/3BusinessCase.PNG)
     > * To download the full Docomentation [Press here](./Redoc/CreditCardV2/Cortina%20V2%20Credit%20Card%20API.pdf)
     # Cortina Credit Card Flow
     > 'Cortina Credit Card' is a flow in which an Credit Card card are use directly on the Nayax point of sale device in order to perform a transaction.
     > Cortina Credit Card supports 2 types of transactions -
     > * 'Preauthorization' Flow
     >   *  Authorization request - Nayax request to temporarily hold credit in the consumer account balance.
     >   * Settlement request – Nayax request to complete the transaction and to charge partial / full amount from the original authorization request.
     > * 'Pre-selection' Flow
     >   *  Sale Request - Nayax request to charge the consumer for a specific known amount in a single request.
     # Typical Success scenarios
     ## PreAuthorization
     > ![Transaction Flow](Redoc/CreditCardV2/4TypicalPositivePreauthorizationScenario.png)
     > * For activity number 4.b - Start Session Failed Scenario, please check the [following process](#typical-establish-security-failed-scenario---start-session-failed).
     > * For activity number 8.b – User failed to choose a valid product in time Scenario, please check the [following process](#typical-confused-consumer-scenario---inactivity--cancel-invalid-choice).
     > * For activity number 10.b – Vend Failed Scenario, please check the [following process](#typical-vend-failure-scenario---machine-dispence-failure).
     > * For activity number 12.b – Settlement response Failed Scenario, please check the [following process](#typical-payment-decline-scenario---settlement-failed).
     ## PreSelecation
     > Positive Preselection Scenario- (Non EMV or One Step EMV)
     > ![Transaction Flow 2](Redoc/CreditCardV2/11TypicalPositivePreselectionScenario.png)
     > * For activity number 3.b – User failed to choose a valid product in time Scenario, please check the [following process](#typical-confused-consumer-scenario---inactivitycancelinvalid-choose).
     > * For activity number 5.b - Start Session Failed Scenario, please check the [following process](#typical-establish-security-failed-scenario---start-session-failed).
     > * For activity number 6.b – Sale request Failed Scenario, please check the [following process](#typical-payment-decline-scenario---sale-failed).
     > * For activity number 9.b – Vend Failed Scenario, please check the [following process](#typical-vend-failure-scenario---machine-dispence-failure).
     > * For activity number 11.b – Sale End Notification Response Failed Scenario, please check the [following process](#typical-notification-failed-scenario---sale-end-notification-failed).
     > Positive Preselection Scenario- (Two Steps EMV)
     > ![Transaction Flow 2](Redoc/CreditCardV2/11TypicalPositivePreselectionScenario_TwoSteps.png)
     # Typical fail scenarios
     ## PreAuthorization  
     ### Typical establish security failed Scenario - Start Session Failed   
     > ![Transaction Flow 3](Redoc/CreditCardV2/5StartSessionFailed.PNG)
     ### Typical Payment Decline Scenario - Authorization Failed      
     > ![Transaction Flow 4](Redoc/CreditCardV2/6AuthorizationFailedScenario.PNG)
     ### Typical Confused Consumer Scenario - Inactivity / Cancel /Invalid Choice      
     > ![Transaction Flow 5](Redoc/CreditCardV2/6PreauthorisationConfusedConsumer.PNG)
     ### Typical Vend Failure Scenario - Machine Dispence Failure      
     > ![Manual Refund 6](Redoc/CreditCardV2/7PreauthorizationVendFail.PNG)
     ### Typical Payment Decline Scenario - Settlement Failed      
     > ![Manual Refund 7](Redoc/CreditCardV2/8PreauthorizationSettlementFailed.PNG)
     ## PreSelecation  
     ### Typical Confused Consumer Scenario - Inactivity/Cancel/invalid choose      
     > ![Transaction Flow 8](Redoc/CreditCardV2/12PreSelectionConfusedConsumer.PNG)
     ### Typical establish security failed Scenario - Start Session Failed     
     > ![Transaction Flow 9](Redoc/CreditCardV2/13StartSessionFailed.PNG)
     ### Typical Payment Decline Scenario - Sale Failed        
     > ![Transaction Flow 10](Redoc/CreditCardV2/14SaleFailedScenario.PNG)
     ### Typical Vend Failure Scenario - Machine Dispence Failure       
     > ![Transaction Flow 11](Redoc/CreditCardV2/15PreSelectionVendFail.PNG)
     ### Typical Notification failed Scenario - Sale End notification failed      
     > ![Transaction Flow 12](Redoc/CreditCardV2/16SaleEndNotificationFailed.PNG)
     ### Typical Payment Decline Scenario - Void Failed      
     > ![Transaction Flow 13](Redoc/CreditCardV2/17PreselectionVoidFailed.PNG)
     ### Typical Payment Decline Scenario - Preselection Settlement Failed      
     > ![Transaction Flow 13](Redoc/CreditCardV2/18PreselectionSettlementFailed.PNG)
     # Technical Prerequisites
     * Cortina is a REST interface over HTTPS (TLS > V1.2) using JSON format for I/O. 
     * Optional Site to Site VPN. If needed, it shall be discussed with the technical point of contact at Nayax.
     ### **Provided by Nayax to the Integrator**
      * Secret Token (Token_Value, Token_ID) - Nayax provides an Integrator with a unique secret token (Secret Token Value and Secret Token ID) for communication. 
      * From time-to-time Nayax may contact the integrator to replace the Token.
      * To download IP whitelisting (if needed) [Press here](./Redoc/CortinaMain/NayaxIpWhitelisting.pdf)  
      * Nayax relevant POS devices. 
     ### **Provided by Integrator to Nayax**
      * The integrator shall provide Nayax with HTTPS URL access end points -  
        * HTTPS URL - TEST environment
        * HTTPS URL - Production environment 
      * The Integrator will provide Nayax its desired timeout in milliseconds - 
      * range between `[Int] 1000 – 15000`, default value is 15000.  
      * Immediate void settings - In case of T/O in authorization or settlement request, Nayax server shall perform by default `2` attempts to cancel/void the transaction with `30` seconds intervals between. For more details contact Nayax TPOC. 
      * In preselection Transactions by default Nayax shall perform Sale end notification to inform the payment gateway (integrator) that the operator has completed the transaction successfully. For more details contact Nayax TPOC. 
      * The Integrator will provide Nayax customize fields according to Nayax Hirarchy as needed.
      * Distributor > Operator > Direct Actor > Machine / Device. 
      * The integrator shall provide Nayax with relevant testing Cards.
      * Brand certification shall be performed either by Nayax or by the Integrator (To be discussed during the business review).
      
