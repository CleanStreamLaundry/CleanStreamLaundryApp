components:
  schemas:
    BatchStatus:
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 99
      type: integer
      format: int32
      description: |
        *  0 - Missing
        *  1 - Open
        *  2 - InProgress
        *  3 - Close
        *  4 - Reopen
        *  5 - Closed
        *  6 - Declined
        * 99 - Unknown
    BatchOperation:
      enum:
        - 1
        - 3
      type: integer
      format: int32
      description: |
        * 1 - Open
        * 3 - Close
    ECIType:
      enum:
        - 01
        - 05
        - 06
        - 07
      type: integer
      format: int32
      description: |
        Conditional (Only if interface = 01)
        Pre process method used for Electronic Commerce
        * 01 - Mail Order/Telephone Order (MOTO, no 3DS)
        * 05 - Fully authenticated CAVV/UCAFF verification submission
        * 06 - Non-authenticated security transaction at a 3-D Secure-capable Merchant.
               The Merchant attempted to authenticate the Cardholder using 3-D Secure (aka: Proof of attempt)
        * 07 - Non-authenticated security submission
      example: 01
    ECom3DSType:
      enum:
        - 0
        - 1
        - 2
      type: integer
      format: int32
      description: |
        3DS version supported by the merchant:
        * 0 - Not supported
        * 1 - 3DS version 1.0
        * 2 - 3DS version  2.0
      example: 1
    ResponseCode:
      enum:
        - 0
        - 4
        - 992
        - 993
        - 994
        - 996
        - 997
        - 998
        - 999
        - 1021
      type: integer
      format: int32
      description: |
        Error description
        *   0 - Success
        *   4 - Insufficient funds
        * 990 - CertificateFileName not found
        * 991 - Failed to decipher message body
        * 992 - Timeout
        * 993 - Keep polling
        * 994 - Card Brand Not supported
        * 996 - Transaction ID unknown / Duplicate Transaction ID (Start Session Error)
        * 997 - Missing mandatory parameters
        * 998 - Validation/request cannot be parsed
        * 999 - General system failure
        * 1010 - Public Key Certificate not found
        * 1011 - Method not Implemented
        * 1021 - Switch Interface
    RegularCreditType:
      enum:
        - 0
        - 1
      type: integer
      format: int32
      description: |
        * 0 - transactions
        * 1 - amount
    Status:
      type: object
      description: Transaction status
      properties:
        Verdict:
          type: string
          nullable: false
          description: |
            - Mandatory
            - Const string values:
            - Status of the request ('Approved'/'Declined')
        Code:
          type: integer
          format: int32
          nullable: true
          description: |
            - Conditional - Only if verdict value is declined
            - Reason for declined request.
              *    4 - Insufficient funds
              *    2 - Transaction ID unknown
              *    3 - Cardholder exceeded daily / weekly / monthly transaction count limit
              *    4 - Cardholder exceeded transaction amount limit
              *    5 - Suspected Fraud
              *    6 - General system failure
              *    7 - Invalid amount
              *    8 - Request cannot be parsed (format error)
              *    9 - Transaction not allowed to cardholder
              *   20 - No VPN or MQTT enabled
              *   30 - Machine is not responding
              *   40 - Request cannot be parsed (format error)
              *   50 - Unknown machine Id
              *  990 - CertificateFileName not found
              *  991 - Failed to decipher message body
              *  992 - Timeout
              *  994 - Card Brand Not supported
              *  996 - Transaction ID unknown / Duplicate Transaction ID
              *  997 - Missing mandatory parameters
              *  998 - Validation/request cannot be parsed
              *  999 - General system failure
              *  1010 - Public Key Certificate not found
              *  1011 - Method not Implemented
        StatusMessage:
          type: string
          nullable: true
          description: |
            - Optional
            - Length: 255
            - Transaction status message free text field / additional varying data
      additionalProperties: false
    Product:
      type: object
      nullable: true
      description: Product information
      properties:
        Code:
          type: integer
          format: int32
          nullable: true
          description: |
            - Mandatory
            - length: short (int16)
            - Code of the selected item as defined in the Nayax backoffice or vending machine
        CatalogProductId:
          type: string
          nullable: true
          description: |
            - Optional
            - length: string (100)
            - External unique identifier of the selected item (the product catalog number) as defined in the Nayax backoffice
        Name:
          type: string
          nullable: true
          description: |
            - Optional
            - Length: 255
            - Product name as defined in the Nayax backoffice
        Price:
          type: number
          format: double
          nullable: true
          description: |
            - Mandatory
            - Product price in the machine's currency. This the original Product price while the transaction amount is the billing price after adjustments such as surchage or loyalty.
        UnitOfMeasurement:
          type: string
          nullable: true
          description: |
            - Optional
            - Length: 64
            - Product's unit of measurement (e.g 'unit' or 'Liter')
        Measurement:
          type: number
          format: double
          nullable: true
          description: |
            - Optional
            - Decimal
            - Product's quantity in the unit of measurement
        Group:
          type: string
          nullable: false
          description: |
            - Mandatory
            - Length: 255
            - Product's group as existing in the product map          
        PulseLineNumber:
          type: integer
          format: int32
          nullable: true
          description: |
            - Extending remote vend capability to support multiple machines via pulse. 
            - positive (PulseLineNumber >= 0)
      additionalProperties: false
    CustomData:
      type: object
      nullable: true
      description: Custom Fields Information, Contact Nayax TPOC to deifne.
      properties:
        DirectActor:
          type: string
          nullable: true
          description: |
            Direct actor custom data (String in json format)
          example: 'String'
        Operator:
          type: string
          nullable: true
          description: |
            Operator custom data (String in json format)
          example: 'String'
        Distributor:
          type: string
          nullable: true
          description: |
            Distributor custom data (String in json format)
          example: 'String'
        Actor:
          type: string
          nullable: true
          description: |
            Actor custom data (String in json format)
          example: 'String'
        Machine:
          type: string
          nullable: true
          description: |
            Machine custom data (String in json format)
          example: 'String'
      additionalProperties: false
    BasicInfo:
      type: object
      nullable: true
      description: Basic Information
      properties:
        TransactionId:
          type: string
          nullable: true
          description: |
            String (40)
            Mandatory
            The unique identifier for this transaction.
            If /StartSession has been used then this will echo the transaction Id encrypted in 'TranIDCipher'.
            If /StartSession was not Used - Nayax Engine shall generate this Value.
          example: 'N99O4XURDQYJZIK4OTCAWF1RHHA40TZWVCRB'
        NayaxTransactionId:
          type: integer
          nullable: true
          format: int64
          description: |
            - Nayax Internal Unique identifier for the transaction which will be echoed
