    PaymentInfo:
      type: object
      nullable: true
      description: |
        - This Object Identifies Transaction Inforamtion and references (RRNs,Transaction IDs, AUth Code, original amounts etc..)
        - The Object is Included in all response messages for Payment calls
        - When included in requests (cases of /Settlement, /Void, /Refund, and /Inquiry) the object refers to the PaymentInfo object returned on a previous call (e.g a Refund request will include the information returned in the Original /Sale, /Settlement or /Inquiry responces the setteled it.)
      properties:
        SrvTranId:
          type: string
          nullable: true
          description: |
            - the Integrator's internal transaction id. 
            - Conditional, only if /StartSession was not Used.
            - If /StartSession was used, this should be either empty or Echo the Transaction ID sent in the request.
          example: '3584697388'
        AuthCode:
          type: string
          nullable: true
          description: |
            - String (40)
            - Conditional For Credit cards implementation, when transaction is approved,
            - Optional for Static QR, Dynamic QR and ExternalPP.
            - External (usually Card issuer's)Authorization Code
            - Note: In dynamic QR implementation The Value returned in an approved /Inquiry request shall represent the Aprroval Code of the transaction and shall override any previous values returned.
          example: '333333'
        AuthAmount:
          type: number
          format: double
          nullable: true
          description: |
            - Conditional, on /Authorization and /Sale responses,
            - Optional for all other cases,
            - The original amount requested in /Authorization or /Sale requested.
          example: 5.5
        SettAmount:
          type: number
          format: double
          nullable: true
          description: |
            - Conditional, on /Settlement, /Inquiry and /Sale responses,
            - Optional for all other cases,
            - The original amount requested in /Settlement or /Sale process.
          example: 5.5
        RRN:
          type: string
          nullable: true
          description: |
            Reference Retrieval Number, Used as External Transaction Identification for external parties (Usually Card schemes)
            From support perspective - It is highly recommanded that this ID shall be the one visble to the end consumer/Card holder.
            Note: in /Inquiry response the RRN value must match the predecesing Value sent in the /GenerateQR response.
          example: '111111'
        Token:
          type: string
          nullable: true
          description: |
            String(256)
            A unique token for the transaction
            For Internal Nayax use only
          example: 'string'
        AuthDateTime:
          type: string
          nullable: true
          description: |
            - Conditional, on /Authorization and /Sale response
            - The date time string of when the /Authorization ot /Sale took place
            - Format: ddMMyyHHmmss
          example: '071221133300'
        SettDateTime:
          type: string
          nullable: true
          description: |
            - Conditional, on /Settlement and /Sale responses
            - The date time string of when the /Settlement or /Sale took place
            - Format: ddMMyyHHmmss
          example: '071221133330'
        TraceNumber:
          type: string
          nullable: true
          description: |
            Trace number,
            For Internal Nayax use only
          example: '4444'
        AuthSource:
          type: string
          nullable: true
          description: |
            - String(5)
            - For Internal Nayax use only
          example: 'string'
        AdditionalData:
          type: string
          nullable: true
          description: |
            - Optional, Contact Nayx TPOC on order define.
            - String in JSON format.
          example: 'string'
        IsGatewayTimeout:
          type: boolean
          nullable: true
          description: |
            Was there was a gateway timeout (valid in response)
          example: false
        ProviderExternalData:
          type: string
          nullable: true
          description: |
            - Optional.
            - String in JSON format.
          example: 'string'
        InitiateTranReference:
          type: integer
          nullable: true
          format: int64
          description: |
            - Conditional, in case of re-attempt of using a prepaid loyalty card on a terminal in a given transaction, 
            - this field will reflect which transaction (Nayax Transaction ID) this attempt originally belongs to.
          example: 11223344
      additionalProperties: false
