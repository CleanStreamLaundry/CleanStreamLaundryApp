    StartSessionRequest:
      type: object
      properties:
        TokenId:
          type: string
          nullable: false
          description: |
            3rd party Secret Token reference number
        RandomNumber:
          type: string
          nullable: false
          description: |
            Nayax will create 27 char Random Number
        DynamicURL:
          type: string
          nullable: true
          description: |
            - Optional, support different url's.
            - Length: 255
            - Actor level url configuration
      additionalProperties: false
    StartSessionResponse:
      type: object
      properties:
        TranIDCipher:
          type: string
          nullable: false
          description: |
            - Mandatory
            - The Integrator Generates transaction ID  of 36 *Numeric* Chars (or 288 bits).
            - The Integrator then appends the char = and RandomNumber to create the ciphertext of 64 chars
            - Format TransactionId=RandomNumber
            - The integrator encrypts the ciphertexts with the Secret Token in AES ECB.
            - The AES key will be the last (right most) 256 bits (or 32 chars) of the Secret Token the matches the TokenID provided in the request.
            - Nayax will AES ECB decrypt and extract trasaction id
            - The transaction Id value will then be used for all further requests
        Status:
          $ref: '#/components/schemas/Status'
      additionalProperties: false
