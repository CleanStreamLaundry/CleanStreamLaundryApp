            Note: Currencies with no Decimal Place shall be represented as double as well
            Example: 234 JYN = 234.0
          example: 5
        CurrencyCode:
          type: string
          nullable: true
          description: |
            String(3)
            Mandatory
            Currency according to ISO4217
            Attribute format: Alpha-3
          example: 'ILS'
        CurrencyNumeric:
          type: string
          nullable: true
          description: |
            String(3)
            Mandatory
            Currency according to ISO4217
            Attribute format: Numeric-3
          example: '376'
        SiteId:
          type: integer
          format: int16
          nullable: true
          description: |
            Region of the Nayax server. 
